<script>
/* =============================================================================
   HRM :: ViewsAdmin.html
   โมดูล 09 Performance, 10 Training, 11 Career, 12 Document, 13 Discipline,
          14 Offboarding, 15 Reports, Audit, Admin
   ============================================================================= */

VIEWS.performance = {
  tab: 'me',

  render: function (host) {
    this.host = host;
    this.paint();
    return Promise.resolve();
  },

  paint: function () {
    const tabs = [{ id: 'me', label: 'การประเมินของฉัน' }];
    if (Store.can('performance.write')) tabs.push({ id: 'appraise', label: 'ประเมินผู้ใต้บังคับบัญชา' });
    if (Store.can('performance.read')) {
      tabs.push({ id: 'cycle', label: 'รอบการประเมิน' });
      tabs.push({ id: 'merit', label: 'เลื่อนเงินเดือน' });
    }
    this.host.innerHTML = UI.tabs(tabs, this.tab, 'VIEWS.performance.setTab') +
                          '<div id="perfPane">' + UI.loading(3) + '</div>';
    this.paintPane();
  },

  setTab: function (id) { this.tab = id; this.paint(); },

  paintPane: function () {
    const pane = document.getElementById('perfPane');

    if (this.tab === 'me' || this.tab === 'appraise') {
      const asAppraiser = this.tab === 'appraise';
      return apiSafe('performance.list',
                     asAppraiser ? { asAppraiser: true } : { mine: true },
                     { fallback: [] }).then(function (rows) {
        pane.innerHTML = UI.card(asAppraiser ? 'ใบประเมินที่ฉันเป็นผู้ประเมิน' : 'ผลการประเมินของฉัน',
          UI.table([
            { label: 'รอบ', render: function (r) {
                return Fmt.esc((r.appraisal_cycles || {}).name_th || '—'); } },
            asAppraiser ? { label: 'ผู้รับการประเมิน', render: function (r) {
                return employeeLink(r.employee_id, empName(r.employees),
                                    (r.employees || {}).emp_code); } } : null,
            { label: 'คะแนนผลงาน', className: 'num', render: function (r) {
                return r.kpi_score === null ? '—' : Fmt.money(r.kpi_score, 2); } },
            { label: 'คะแนนสมรรถนะ', className: 'num', render: function (r) {
                return r.competency_score === null ? '—' : Fmt.money(r.competency_score, 2); } },
            { label: 'รวม', className: 'num', render: function (r) {
                return r.total_score === null ? '—'
                  : '<strong>' + Fmt.money(r.total_score, 2) + '</strong>'; } },
            { label: 'ระดับ', render: function (r) {
                return r.rating_code
                  ? '<span class="badge badge-green">' + Fmt.esc(r.rating_code) + ' · ' +
                    Fmt.esc(r.rating_label || '') + '</span>' : '—'; } },
            { label: 'สถานะ', render: function (r) {
                return Labels.badge('request_status', r.status); } },
            { label: '', className: 'right', render: function (r) {
                return '<button class="btn btn-ghost btn-sm" onclick="VIEWS.performance.open(\'' +
                       r.id + '\',\'' + (asAppraiser ? 'APPRAISER' : 'SELF') + '\')">เปิด</button>'; } }
          ].filter(Boolean), rows, { emptyMessage: 'ยังไม่มีใบประเมิน' }), { tight: true });
      });
    }

    if (this.tab === 'cycle') {
      return apiSafe('performance.cycleList', {}, { fallback: [] }).then(function (rows) {
        VIEWS.performance.cycles = rows;
        pane.innerHTML = UI.card('รอบการประเมินผลการปฏิบัติงาน', UI.table([
          { label: 'รหัส', key: 'code', width: '100px' },
          { label: 'ชื่อรอบ', key: 'name_th' },
          { label: 'ปีงบประมาณ', className: 'num', key: 'fiscal_year' },
          { label: 'ช่วงประเมิน', render: function (r) {
              return Fmt.date(r.start_date, true) + ' – ' + Fmt.date(r.end_date, true); } },
          { label: 'สถานะ', render: function (r) {
              return '<span class="badge badge-blue">' + Fmt.esc(r.status) + '</span>'; } },
          { label: '', className: 'right', render: function (r) {
              return Store.can('performance.write')
                ? '<button class="btn btn-secondary btn-sm" onclick="VIEWS.performance.openCycle(\'' +
                  r.id + '\')">เปิดรอบ</button>' : ''; } }
        ], rows, { emptyMessage: 'ยังไม่มีรอบการประเมิน' }),
        { tight: true,
          actions: Store.can('performance.write')
            ? '<button class="btn btn-primary btn-sm" onclick="VIEWS.performance.editCycle()">' +
              '+ สร้างรอบ</button>' : '' });
      });
    }

    if (this.tab === 'merit') {
      return apiSafe('performance.meritList', {}, { fallback: [] }).then(function (rows) {
        pane.innerHTML = UI.card('การเลื่อนเงินเดือนตามผลประเมิน', UI.table([
          { label: 'บุคลากร', render: function (r) {
              return employeeLink(r.employee_id, empName(r.employees),
                                  (r.employees || {}).emp_code); } },
          { label: 'ระดับผลงาน', render: function (r) {
              return r.rating_code
                ? '<span class="badge badge-green">' + Fmt.esc(r.rating_code) + '</span>' : '—'; } },
          { label: 'ร้อยละ', className: 'num', render: function (r) {
              return Fmt.percent(r.increase_percent, 2); } },
          { label: 'เดิม', className: 'num', render: function (r) {
              return Fmt.money(r.old_salary); } },
          { label: 'ใหม่', className: 'num', render: function (r) {
              return '<strong>' + Fmt.money(r.new_salary) + '</strong>'; } },
          { label: 'มีผลวันที่', render: function (r) { return Fmt.date(r.effective_date, true); } },
          { label: 'สถานะ', render: function (r) {
              return Labels.badge('request_status', r.status); } }
        ], rows, { emptyMessage: 'ยังไม่มีรายการเลื่อนเงินเดือน' }),
        { tight: true,
          actions: Store.can('performance.write')
            ? '<button class="btn btn-secondary btn-sm" onclick="VIEWS.performance.proposeMerit()">' +
              'เสนอเลื่อนเงินเดือน</button>' : '' });
      });
    }
  },

  open: function (id, mode) {
    Modal.open({ title: 'ใบประเมินผลการปฏิบัติงาน', size: 'wide', body: UI.loading(5) });
    apiSafe('performance.get', { id: id }).then(function (ap) {
      const scrim = document.querySelector('.modal-scrim:last-child');
      const body = scrim && scrim.querySelector('.modal-body');
      if (!body || !ap) return;

      const editable = (mode === 'SELF' && ['DRAFT', 'SELF_SUBMITTED'].indexOf(ap.status) >= 0) ||
                       (mode === 'APPRAISER' &&
                        ['APPROVED', 'ACKNOWLEDGED', 'CLOSED'].indexOf(ap.status) < 0);

      const sections = { KPI: 'ผลสัมฤทธิ์ของงาน', COMPETENCY: 'สมรรถนะ', BEHAVIOR: 'พฤติกรรม' };
      const grouped = {};
      (ap.scores || []).forEach(function (s) {
        (grouped[s.section] = grouped[s.section] || []).push(s);
      });

      let html = UI.defList([
        ['รอบ', Fmt.esc((ap.appraisal_cycles || {}).name_th || '—')],
        ['ผู้รับการประเมิน', Fmt.esc(empName(ap.employees))],
        ['สถานะ', Labels.badge('request_status', ap.status)],
        ['คะแนนรวม', ap.total_score === null ? '—' : Fmt.money(ap.total_score, 2)],
        ['ระดับ', Fmt.esc(ap.rating_label || '—')]
      ]);

      Object.keys(grouped).forEach(function (sec) {
        html += '<h3 class="mt-3 mb-1" style="font-size:14px">' +
                Fmt.esc(sections[sec] || sec) + '</h3>' +
                '<div class="table-wrap"><table><thead><tr>' +
                '<th>หัวข้อ</th><th class="num">น้ำหนัก</th><th class="num">เต็ม</th>' +
                '<th class="num">ประเมินตนเอง</th><th class="num">ผู้ประเมิน</th></tr></thead><tbody>' +
                grouped[sec].map(function (s) {
                  const field = editable
                    ? '<input class="field" type="number" step="0.5" min="0" max="' +
                      s.max_score + '" style="width:80px;text-align:right" ' +
                      'data-score-id="' + s.id + '" value="' +
                      (mode === 'SELF' ? (s.self_score === null ? '' : s.self_score)
                                       : (s.appraiser_score === null ? '' : s.appraiser_score)) + '">'
                    : null;
                  return '<tr><td>' + Fmt.esc(s.item_title) + '</td>' +
                    '<td class="num">' + Fmt.percent(s.weight_percent, 0) + '</td>' +
                    '<td class="num">' + Fmt.money(s.max_score, 0) + '</td>' +
                    '<td class="num">' + (mode === 'SELF' && editable ? field
                      : (s.self_score === null ? '—' : Fmt.money(s.self_score, 1))) + '</td>' +
                    '<td class="num">' + (mode === 'APPRAISER' && editable ? field
                      : (s.appraiser_score === null ? '—' : Fmt.money(s.appraiser_score, 1))) +
                    '</td></tr>';
                }).join('') + '</tbody></table></div>';
      });

      if (editable) {
        html += '<div class="field-group mt-3"><label class="field-label">ความเห็นเพิ่มเติม</label>' +
                '<textarea class="field" id="apComment">' +
                Fmt.esc(mode === 'SELF' ? (ap.self_comment || '') : (ap.appraiser_comment || '')) +
                '</textarea></div>';
      } else {
        html += '<div class="mt-3">' + UI.defList([
          ['ความเห็นผู้รับการประเมิน', Fmt.esc(ap.self_comment || '—')],
          ['ความเห็นผู้ประเมิน', Fmt.esc(ap.appraiser_comment || '—')],
          ['จุดแข็ง', Fmt.esc(ap.strengths || '—')],
          ['สิ่งที่ควรพัฒนา', Fmt.esc(ap.improvements || '—')]
        ]) + '</div>';
      }

      body.innerHTML = html;

      // ปุ่มท้าย modal
      const foot = scrim.querySelector('.modal-foot');
      const buttons = [];
      if (editable) {
        buttons.push({ label: 'บันทึกร่าง', kind: 'btn-secondary', submit: false });
        buttons.push({ label: mode === 'SELF' ? 'ส่งประเมินตนเอง' : 'ส่งผลการประเมิน',
                       kind: 'btn-primary', submit: true });
      }
      if (mode === 'SELF' && ap.status === 'APPROVED') {
        buttons.push({ label: 'รับทราบผล', kind: 'btn-primary', ack: true });
      }
      if (mode === 'APPRAISER' && ['APPRAISED', 'REVIEWED'].indexOf(ap.status) >= 0 &&
          Store.can('performance.approve')) {
        buttons.push({ label: 'อนุมัติผลประเมิน', kind: 'btn-primary', approve: true });
      }

      if (foot) {
        foot.innerHTML = '';
        buttons.forEach(function (b) {
          const btn = document.createElement('button');
          btn.className = 'btn ' + b.kind;
          btn.textContent = b.label;
          btn.onclick = function () {
            const scores = Array.prototype.map.call(
              body.querySelectorAll('[data-score-id]'), function (el) {
                return { id: el.dataset.scoreId,
                         score: el.value === '' ? null : Number(el.value) };
              });
            let p;
            if (b.ack) p = api('performance.acknowledge', { id: id });
            else if (b.approve) p = api('performance.approve', { id: id });
            else p = api('performance.saveScores', {
              id: id, mode: mode, scores: scores, submit: !!b.submit,
              comment: (body.querySelector('#apComment') || {}).value || null
            });

            btn.disabled = true;
            p.then(function () {
              Toast.ok('บันทึกแล้ว');
              Modal.close();
              VIEWS.performance.paintPane();
            }).catch(function (e) { Toast.error(e.message); btn.disabled = false; });
          };
          foot.appendChild(btn);
        });
        const closeBtn = document.createElement('button');
        closeBtn.className = 'btn btn-ghost';
        closeBtn.textContent = 'ปิด';
        closeBtn.onclick = function () { Modal.close(); };
        foot.appendChild(closeBtn);
      }
    });
  },

  editCycle: function () {
    const fy = Store.boot.fiscalYear;
    const fields = [
      { key: 'code', label: 'รหัสรอบ', required: true, placeholder: 'FY' + fy + 'R1' },
      { key: 'name_th', label: 'ชื่อรอบ', required: true, full: true },
      { key: 'fiscal_year', label: 'ปีงบประมาณ', type: 'number', required: true },
      { key: 'round_no', label: 'รอบที่', type: 'number' },
      { key: 'start_date', label: 'ประเมินตั้งแต่', type: 'date', required: true },
      { key: 'end_date', label: 'ถึงวันที่', type: 'date', required: true },
      { key: 'self_eval_due', label: 'กำหนดส่งประเมินตนเอง', type: 'date' },
      { key: 'supervisor_due', label: 'กำหนดส่งผู้ประเมิน', type: 'date' }
    ];
    Modal.open({
      title: 'สร้างรอบการประเมิน',
      body: Form.html(fields, {
        fiscal_year: fy, round_no: 1,
        name_th: 'รอบที่ 1/' + fy
      }),
      buttons: [
        { label: 'ยกเลิก' },
        { label: 'บันทึก', kind: 'btn-primary', onClick: function (body) {
            return api('performance.cycleSave', Form.read(body, fields)).then(function () {
              Toast.ok('สร้างรอบแล้ว');
              VIEWS.performance.paintPane();
            });
          } }
      ]
    });
  },

  openCycle: function (cycleId) {
    apiSafe('performance.formList', {}, { fallback: [] }).then(function (forms) {
      const fields = [
        { key: 'form_id', label: 'แบบประเมินที่ใช้', type: 'select',
          options: forms.map(function (f) { return { value: f.id, label: f.name_th }; }) }
      ];
      Modal.open({
        title: 'เปิดรอบการประเมิน',
        body: '<p class="small muted mb-2">ระบบจะสร้างใบประเมินให้บุคลากรทุกคนที่ปฏิบัติงานอยู่ ' +
              'พร้อมกำหนดผู้ประเมินจากผู้บังคับบัญชาโดยอัตโนมัติ</p>' +
              Form.html(fields, { form_id: forms.length ? forms[0].id : '' }),
        buttons: [
          { label: 'ยกเลิก' },
          { label: 'เปิดรอบ', kind: 'btn-primary', onClick: function (body) {
              const d = Form.read(body, fields);
              return api('performance.openCycle', { cycle_id: cycleId, form_id: d.form_id })
                .then(function (out) {
                  Toast.ok('สร้างใบประเมิน ' + Fmt.num(out.created) + ' ใบ' +
                           (out.skipped ? ' (ข้าม ' + out.skipped + ' ใบที่มีอยู่แล้ว)' : ''));
                  VIEWS.performance.paintPane();
                });
            } }
        ]
      });
    });
  },

  proposeMerit: function () {
    const cycles = this.cycles || [];
    const fields = [
      { key: 'cycle_id', label: 'รอบการประเมิน', type: 'select', required: true,
        options: cycles.map(function (c) { return { value: c.id, label: c.name_th }; }) },
      { key: 'effective_date', label: 'มีผลตั้งแต่วันที่', type: 'date', required: true }
    ];
    Modal.open({
      title: 'เสนอเลื่อนเงินเดือนตามผลประเมิน',
      body: '<p class="small muted mb-2">ระบบจะคำนวณจากระดับผลงาน: ' +
            'A 4% · B 3% · C 2.5% · D 2% · E 0%</p>' + Form.html(fields, {}),
      buttons: [
        { label: 'ยกเลิก' },
        { label: 'เสนอ', kind: 'btn-primary', onClick: function (body) {
            return api('performance.meritPropose', Form.read(body, fields)).then(function (out) {
              Toast.ok('เสนอเลื่อนเงินเดือน ' + Fmt.num(out.proposed) + ' รายการ');
              VIEWS.performance.paintPane();
            });
          } }
      ]
    });
  }
};

/* ========================================================================== */

VIEWS.training = {
  tab: 'session',

  render: function (host) {
    this.host = host;
    this.paint();
    return Promise.resolve();
  },

  paint: function () {
    const tabs = [
      { id: 'session', label: 'หลักสูตร/รุ่นอบรม' },
      { id: 'my', label: 'ประวัติอบรมของฉัน' },
      { id: 'idp', label: 'แผนพัฒนารายบุคคล' }
    ];
    if (Store.can('training.read')) tabs.push({ id: 'summary', label: 'สรุปการพัฒนา' });

    this.host.innerHTML = UI.tabs(tabs, this.tab, 'VIEWS.training.setTab') +
                          '<div id="trPane">' + UI.loading(3) + '</div>';
    this.paintPane();
  },

  setTab: function (id) { this.tab = id; this.paint(); },

  paintPane: function () {
    const pane = document.getElementById('trPane');

    if (this.tab === 'session') {
      return apiSafe('training.sessionList', { limit: 60 }, { fallback: [] }).then(function (rows) {
        pane.innerHTML = UI.card('รุ่นการอบรม', UI.table([
          { label: 'หลักสูตร', render: function (r) {
              const c = r.training_courses || {};
              return '<strong>' + Fmt.esc(r.title || c.name_th || '—') + '</strong>' +
                '<div class="small muted">' + Fmt.esc(c.code || '') +
                (c.duration_hours ? ' · ' + c.duration_hours + ' ชม.' : '') + '</div>'; } },
          { label: 'ช่วงวันที่', render: function (r) {
              return Fmt.date(r.start_date, true) +
                (r.start_date !== r.end_date ? ' – ' + Fmt.date(r.end_date, true) : ''); } },
          { label: 'สถานที่', key: 'venue' },
          { label: 'ที่นั่ง', className: 'num', render: function (r) {
              return r.max_seats
                ? Fmt.num(r.registered_count) + '/' + Fmt.num(r.max_seats)
                : Fmt.num(r.registered_count); } },
          { label: 'สถานะ', render: function (r) {
              return Labels.badge('request_status', r.status); } },
          { label: '', className: 'right', render: function (r) {
              return ['PLANNED', 'OPEN'].indexOf(r.status) >= 0
                ? '<button class="btn btn-primary btn-sm" onclick="VIEWS.training.register(\'' +
                  r.id + '\')">ลงทะเบียน</button>' : ''; } }
        ], rows, { emptyMessage: 'ยังไม่มีรุ่นการอบรม' }),
        { tight: true,
          actions: Store.can('training.write')
            ? '<button class="btn btn-primary btn-sm" onclick="VIEWS.training.editSession()">' +
              '+ เปิดรุ่นอบรม</button>' : '' });
      });
    }

    if (this.tab === 'my') {
      return Promise.all([
        apiSafe('training.registrationList', { mine: true }, { fallback: [] }),
        apiSafe('training.recordList', {}, { fallback: [] })
      ]).then(function (r) {
        pane.innerHTML =
          UI.card('การลงทะเบียนของฉัน', UI.table([
            { label: 'หลักสูตร', render: function (x) {
                const s = x.training_sessions || {};
                const c = s.training_courses || {};
                return Fmt.esc(s.title || c.name_th || '—'); } },
            { label: 'ช่วงวันที่', render: function (x) {
                const s = x.training_sessions || {};
                return Fmt.date(s.start_date, true); } },
            { label: 'สถานะ', render: function (x) {
                return Labels.badge('request_status', x.status); } },
            { label: 'คะแนนหลังอบรม', className: 'num', render: function (x) {
                return x.post_test_score === null ? '—' : Fmt.money(x.post_test_score, 1); } }
          ], r[0], { emptyMessage: 'ยังไม่ได้ลงทะเบียนอบรม' }), { tight: true }) +
          '<div class="mt-2"></div>' +
          UI.card('ประวัติการอบรม', UI.table([
            { label: 'หลักสูตร', key: 'course_name' },
            { label: 'ผู้จัด', key: 'provider' },
            { label: 'ช่วงวันที่', render: function (x) {
                return Fmt.date(x.start_date, true); } },
            { label: 'ชั่วโมง', className: 'num', key: 'hours' },
            { label: 'หน่วยคะแนน', className: 'num', key: 'cpe_credits' },
            { label: 'หมดอายุ', render: function (x) {
                return x.expire_date ? Fmt.date(x.expire_date, true) : '—'; } }
          ], r[1], { emptyMessage: 'ยังไม่มีประวัติการอบรม' }), { tight: true });
      });
    }

    if (this.tab === 'idp') {
      return apiSafe('training.idpGet', {}, { fallback: { plan: null, gaps: [] } })
        .then(function (d) {
          const plan = d && d.id ? d : null;
          pane.innerHTML =
            UI.card('แผนพัฒนารายบุคคล ปีงบประมาณ ' + Store.boot.fiscalYear,
              plan
                ? UI.defList([
                    ['เป้าหมายความก้าวหน้า', Fmt.esc(plan.career_goal || '—')],
                    ['ตำแหน่งเป้าหมาย', Fmt.esc((plan.positions || {}).name_th || '—')],
                    ['สถานะ', Labels.badge('request_status', plan.status)],
                    ['ความคืบหน้า', Fmt.percent(plan.progress_percent, 0) +
                      UI.meter(plan.progress_percent, 100)]
                  ]) +
                  '<h3 class="mt-3 mb-1" style="font-size:14px">กิจกรรมการพัฒนา</h3>' +
                  UI.table([
                    { label: 'กิจกรรม', key: 'title' },
                    { label: 'วิธีการ', key: 'method' },
                    { label: 'สมรรถนะ', render: function (a) {
                        return Fmt.esc((a.competencies || {}).name_th || '—'); } },
                    { label: 'ระดับ', className: 'num', render: function (a) {
                        return (a.current_level || 0) + ' → ' + (a.target_level || 0); } },
                    { label: 'กำหนดเสร็จ', render: function (a) {
                        return Fmt.date(a.target_date, true); } },

      ];
      Modal.open({

        body: Form.html(fields, { copies: 1, language: 'TH' }),
        buttons: [
          { label: 'ยกเลิก' },
          { label: 'ส่งคำขอ', kind: 'btn-primary', onClick: function (body) {
              return api('document.request', Form.read(body, fields)).then(function (out) {
                Toast.ok('ส่งคำขอเลขที่ ' + (out.request_no || '') + ' แล้ว');
                VIEWS.document.paintPane();

  },

  issue: function (requestId) {
    Modal.confirm('ออกเอกสารตามคำขอนี้ ระบบจะรวมข้อมูลบุคลากรและสร้างไฟล์ให้อัตโนมัติ')
      .then(function (yes) {
        if (!yes) return;
        apiSafe('document.issue', { request_id: requestId }).then(function (out) {
          if (!out) return;
          Toast.ok('ออกเอกสารเลขที่ ' + out.document_no + ' แล้ว');
          if (out.file_url) window.open(out.file_url, '_blank');
          VIEWS.document.paintPane();
        });
      });
  },

  reject: function (requestId) {
    Modal.prompt('ปฏิเสธคำขอเอกสาร', 'เหตุผล', { required: true }).then(function (reason) {
      if (!reason) return;
      apiSafe('document.requestReject', { request_id: requestId, reason: reason })
        .then(function (out) {
          if (!out) return;
          Toast.ok('บันทึกแล้ว');
          VIEWS.document.paintPane();
        });
    });
  },

  revoke: function (id) {
    Modal.prompt('ยกเลิกเอกสาร', 'เหตุผลการยกเลิก', { required: true }).then(function (reason) {
      if (!reason) return;
      apiSafe('document.revoke', { id: id, reason: reason }).then(function (out) {
        if (!out) return;
        Toast.ok('ยกเลิกเอกสารแล้ว');
        VIEWS.document.paintPane();
      });
    });
  }
};

        { label: '', className: 'right', render: function (c) {
            return (Store.can('offboarding.write') && c.status === 'PENDING')
              ? '<button class="btn btn-secondary btn-sm" ' +
                'onclick="VIEWS.offboarding.clear(\'' + c.id + '\')">เคลียร์แล้ว</button>' : ''; } }
      ], s.clearanceItems, { emptyMessage: 'ไม่มีรายการเคลียร์' });
    });
  },

  clear: function (itemId) {
    apiSafe('offboarding.clearanceUpdate', { id: itemId, status: 'CLEARED' }).then(function (out) {
      if (!out) return;
      Toast.ok('บันทึกแล้ว');
      Modal.close();
    });
  },

  act: function (id, action) {
    if (action === 'APPROVE') {
      return Modal.confirm('อนุมัติคำขอพ้นสภาพนี้').then(function (yes) {
        if (!yes) return;
        apiSafe('offboarding.act', { id: id, action: 'APPROVE' }).then(function (out) {
          if (!out) return;
          Toast.ok('อนุมัติแล้ว');
          VIEWS.offboarding.paintPane();
        });
      });
    }
    Modal.prompt('ไม่อนุมัติคำขอ', 'เหตุผล', { required: true }).then(function (reason) {
      if (!reason) return;
      apiSafe('offboarding.act', { id: id, action: 'REJECT', reason: reason }).then(function (out) {
        if (!out) return;
        Toast.ok('บันทึกแล้ว');
        VIEWS.offboarding.paintPane();
      });
    });
  },

  complete: function (id) {
    Modal.confirm('ดำเนินการพ้นสภาพ ระบบจะปิดการดำรงตำแหน่ง ปรับสถานะบุคลากร ' +
                  'ระงับสิทธิใช้งานระบบ และปิดสิทธิสวัสดิการทั้งหมด — ' +
                  'การดำเนินการนี้ย้อนกลับไม่ได้',
                  { danger: true, okLabel: 'ดำเนินการ' }).then(function (yes) {
      if (!yes) return;
      apiSafe('offboarding.complete', { id: id }).then(function (out) {
        if (!out) return;
        Toast.ok('ดำเนินการพ้นสภาพเรียบร้อย');
        VIEWS.offboarding.paintPane();
      });
    });
  }
};

      host.innerHTML =
        '<div class="grid grid-3 mb-2">' + list.map(function (r) {

            'cursor:pointer;padding:0" onclick="VIEWS.report.run(\'' + r.code + '\')">' +

            '</div></button>';
        }).join('') + '</div>' +
        '<div id="reportResult"></div>';
    });
  },

  run: function (code) {
    const host = document.getElementById('reportResult');
    host.innerHTML = UI.loading(4);
    apiSafe('report.run', { code: code, params: {} }).then(function (out) {
      if (!out) return;
      VIEWS.report.current = out;
      host.innerHTML = UI.card(out.name, UI.table(
        out.columns.map(function (c) {
          return {
            label: c.label,
            className: (c.type === 'money' ? 'num' : ''),
            render: function (r) {
              const v = r[c.key];
              if (v === null || v === undefined || v === '') return '—';
              if (c.type === 'money') return Fmt.money(v);
              if (c.type === 'date') return Fmt.date(v, true);
              if (c.type === 'month') return Fmt.month(v);
              return Fmt.esc(v);
            }
          };
        }), out.rows, { emptyMessage: 'ไม่พบข้อมูลตามเงื่อนไข' }),
        { tight: true,
          sub: 'พบ ' + Fmt.num(out.total) + ' รายการ · สร้างเมื่อ ' + Fmt.dateTime(out.generatedAt),
          actions: Store.can('report.export')
            ? '<button class="btn btn-ghost btn-sm" onclick="VIEWS.report.exportCsv(\'' +
              code + '\')">CSV</button> ' +
              '<button class="btn btn-secondary btn-sm" onclick="VIEWS.report.exportSheet(\'' +
              code + '\')">Google Sheets</button> ' +
              '<button class="btn btn-ghost btn-sm" onclick="window.print()">พิมพ์</button>'
            : '' });
      host.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  },

  exportCsv: function (code) {
    apiSafe('report.exportCsv', { code: code, params: {} }).then(function (out) {
      if (!out) return;
      UI.download(out.filename, out.csv);
      Toast.ok('ส่งออก ' + Fmt.num(out.rows) + ' รายการแล้ว');
    });
  },

  exportSheet: function (code) {
    Toast.show('กำลังสร้าง Google Sheets…', 'warn', 'โปรดรอ');
    apiSafe('report.exportSheet', { code: code, params: {} }).then(function (out) {
      if (!out) return;
      Toast.ok('สร้างไฟล์แล้ว ' + Fmt.num(out.rows) + ' รายการ');
      window.open(out.url, '_blank');
    });
  }

        { key: 'role_id', label: 'บทบาท', type: 'select', required: true,
          options: data.roles.map(function (r) { return { value: r.id, label: r.name_th }; }) },
        { key: 'facility_id', label: 'จำกัดเฉพาะสถานบริการ', type: 'select',
          options: o.facilities.map(function (f) { return { value: f.id, label: f.name_th }; }),
          hint: 'เว้นว่าง = มีสิทธิทั้งองค์กร' },
        { key: 'department_id', label: 'จำกัดเฉพาะหน่วยงาน', type: 'select',
          options: o.departments.map(function (x) { return { value: x.id, label: x.name_th }; }) },
        { key: 'effective_to', label: 'สิ้นสุดสิทธิวันที่', type: 'date' }
      ];
      Modal.open({
        title: 'กำหนดสิทธิผู้ใช้',
        body: Form.html(fields, {}),
        buttons: [
          { label: 'ยกเลิก' },
          { label: 'กำหนดสิทธิ', kind: 'btn-primary', onClick: function (body) {
              const p = Form.read(body, fields);
              p.user_id = userId;
              return api('admin.assignRole', p).then(function () {
                Toast.ok('กำหนดสิทธิแล้ว');
                VIEWS.admin.paintPane();
              });
            } }
        ]
      });
    });
  }
};
</script>
