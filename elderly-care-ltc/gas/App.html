const AMP = String.fromCharCode(38);
const ESC_MAP = { '&': AMP + 'amp;', '<': AMP + 'lt;', '>': AMP + 'gt;', '"': AMP + 'quot;', "'": AMP + '#39;' };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC_MAP[c]);
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

const isStaff = () => can(STAFF);

const TH_ML = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
function pad(n) { return String(n).padStart(2, '0'); }
function today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function curMonth() { return today().slice(0, 7); }
function thDate(s) { if (!s) return '-'; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${+m[3]} ${TH_M[+m[2] - 1]} ${String(+m[1] + 543).slice(2)}` : esc(s); }
function thMonth(p) { return p ? `${TH_ML[+p.slice(5, 7) - 1]} ${+p.slice(0, 4) + 543}` : ''; }
function money(n) { return Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function num(n) { return Number(n || 0).toLocaleString('th-TH'); }
function age(b) { if (!b) return ''; const d = new Date(b), t = new Date(); let a = t.getFullYear() - d.getFullYear(); if (t.getMonth() < d.getMonth() || (t.getMonth() === d.getMonth() && t.getDate() < d.getDate())) a--; return a; }

function addYear(d) { const x = new Date(d); x.setFullYear(x.getFullYear() + 1); x.setDate(x.getDate() - 1); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`; }

// ---------------- server bridge ----------------
let busyN = 0;
function busy(on) { busyN = Math.max(0, busyN + (on ? 1 : -1)); $('#busy').hidden = busyN === 0; }
function gs(fn, ...args) {
  return new Promise((res, rej) => google.script.run
    .withSuccessHandler(res)
    .withFailureHandler((e) => rej(e instanceof Error ? e : new Error(String(e))))[fn](...args));
}
async function api(action, payload, quiet) {
  if (!quiet) busy(true);
  try {
    const r = await gs('api', S.token, action, payload || {});
    if (!r || !r.ok) {
      if (r && r.code === 'AUTH') doLogout(true);
      throw new Error(r ? r.error : 'เกิดข้อผิดพลาด');
    }
    return r.data;
  } finally { if (!quiet) busy(false); }
}
function toast(msg, err) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  $('#toast').appendChild(t);
  setTimeout(() => t.remove(), err ? 6000 : 3000);
}
/** ห่อ handler ให้แสดง error เป็น toast */
const run = (fn) => async (...a) => { try { await fn(...a); } catch (e) { console.error(e); toast(e.message || String(e), true); } };

// ---------------- modal ----------------
function openModal({ title, body, foot, wide }) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-bg';
  wrap.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">
    <div class="modal-h"><h3>${esc(title)}</h3><button class="btn-x" data-act="closeModal" aria-label="ปิด">✕</button></div>
    <div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
  $('#modalRoot').appendChild(wrap);
  return wrap;
}
function closeModal(el) { const m = el ? el.closest('.modal-bg') : $('#modalRoot').lastElementChild; if (m) m.remove(); }
function askConfirm(msg, okLabel = 'ยืนยัน', danger) {
  return new Promise((res) => {
    const m = openModal({ title: 'ยืนยันการทำรายการ', body: `<p style="margin:0">${esc(msg)}</p>`,
      foot: `<button class="btn btn-o" data-no>ยกเลิก</button><button class="btn ${danger ? 'btn-d' : 'btn-p'}" data-yes>${esc(okLabel)}</button>` });
    $('[data-yes]', m).onclick = () => { closeModal(m); res(true); };
    $('[data-no]', m).onclick = () => { closeModal(m); res(false); };
  });
}
function askText(title, label, required = true) {
  return new Promise((res) => {
    const m = openModal({ title, body: `<div class="f"><label>${esc(label)}</label><textarea rows="3" data-txt></textarea></div>`,
      foot: `<button class="btn btn-o" data-no>ยกเลิก</button><button class="btn btn-p" data-yes>ตกลง</button>` });
    $('[data-yes]', m).onclick = () => { const v = $('[data-txt]', m).value.trim(); if (required && !v) return toast('กรุณากรอกข้อมูล', true); closeModal(m); res(v); };
    $('[data-no]', m).onclick = () => { closeModal(m); res(null); };
  });
}

// ---------------- forms ----------------
function opts(options, v) {
  return options.map((o) => {
    const [val, lab] = Array.isArray(o) ? o : [o, o];
    return `<option value="${esc(val)}" ${String(val) === String(v == null ? '' : v) ? 'selected' : ''}>${esc(lab)}</option>`;
  }).join('');
}
function fieldHtml(f, v) {
  const req = f.req ? '<span class="req">*</span>' : '';
  const cls = `f ${f.span ? 'span' : ''}`;
  let input;
  switch (f.type) {
    case 'select': input = `<select name="${f.k}" ${f.req ? 'required' : ''} ${f.attrs || ''}>${f.blank === false ? '' : '<option value="">— เลือก —</option>'}${opts(f.options || [], v)}</select>`; break;
    case 'textarea': input = `<textarea name="${f.k}" rows="${f.rows || 3}" ${f.req ? 'required' : ''} placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`; break;
    case 'checkbox': return `<div class="${cls}"><label class="chk"><input type="checkbox" name="${f.k}" ${v === true || v === 'true' ? 'checked' : ''}> ${esc(f.label)}</label></div>`;
    case 'multi': {
      const cur = String(v || '').split(',').map((s) => s.trim());
      input = `<div class="row" style="gap:6px 16px">${f.options.map((o) => `<label class="chk"><input type="checkbox" name="${f.k}" value="${esc(o)}" data-multi ${cur.includes(o) ? 'checked' : ''}> ${esc(o)}</label>`).join('')}</div>`;
      break;
    }
    case 'person': input = personPicker(f.k, v, f.display); break;
    default: input = `<input type="${f.type || 'text'}" name="${f.k}" value="${esc(v)}" ${f.req ? 'required' : ''} ${f.attrs || ''} placeholder="${esc(f.ph || '')}">`;
  }
  return `<div class="${cls}"><label>${esc(f.label)} ${req}</label>${input}${f.hint ? `<div class="xs muted">${esc(f.hint)}</div>` : ''}</div>`;
}
function formHtml(fields, data = {}, cls = '') {
  return `<div class="form ${cls}">${fields.map((f) => fieldHtml(f, data[f.k] != null ? data[f.k] : (f.def != null ? f.def : ''))).join('')}</div>`;
}
function readForm(root) {
  const o = {};
  $$('[name]', root).forEach((el) => {
    const k = el.name;
    if (el.type === 'checkbox' && el.dataset.multi !== undefined) {
      if (!(k in o)) o[k] = '';
      if (el.checked) o[k] = o[k] ? `${o[k]}, ${el.value}` : el.value;
    } else if (el.type === 'checkbox') o[k] = el.checked;
    else if (el.type === 'radio') { if (el.checked) o[k] = el.value; }
    else o[k] = typeof el.value === 'string' ? el.value.trim() : el.value;
  });
  return o;
}
function validate(root) {
  const bad = $$('[required]', root).find((el) => !el.value);
  if (bad) { bad.focus(); throw new Error('กรุณากรอกข้อมูลที่จำเป็น (*) ให้ครบ'); }
  const pp = $$('.pp[data-req]', root).find((el) => !$('input[type=hidden]', el).value);
  if (pp) { $('.pp-q', pp).focus(); throw new Error('กรุณาเลือกบุคคลจากรายการค้นหา'); }
}

// person picker (ค้นหาจากทะเบียนประชากร)
function personPicker(name, value, display, req = true) {
  return `<div class="pp" data-pp ${req ? 'data-req' : ''}><input type="search" class="pp-q" placeholder="พิมพ์ชื่อ / นามสกุล / เลขบัตร..." value="${esc(display || '')}" autocomplete="off">
    <input type="hidden" name="${name}" value="${esc(value || '')}"><div class="pp-list" hidden></div></div>`;
}
let ppTimer;
document.addEventListener('input', (e) => {
  if (!e.target.matches('.pp-q')) return;
  const box = e.target.closest('.pp');
  $('input[type=hidden]', box).value = '';
  clearTimeout(ppTimer);
  ppTimer = setTimeout(run(async () => {
    const q = e.target.value.trim();
    const list = $('.pp-list', box);
    if (q.length < 2) { list.hidden = true; return; }
    const rows = await api('persons.search', { q }, true);
    list.innerHTML = rows.length ? rows.map((r) => `<button type="button" data-act="ppPick" data-id="${r.id}" data-label="${esc(fname(r))}">
      <b>${esc(fname(r))}</b> <span class="xs muted">หมู่ ${esc(r.moo || '-')} บ้านเลขที่ ${esc(r.house_no || '-')} · ${esc(r.cid || '')}</span></button>`).join('')
      : '<div class="empty small">ไม่พบข้อมูล</div>';
    list.hidden = false;
  }), 300);
});

// ---------------- tables ----------------
function tableHtml(cols, rows, { rowAct, rowId, empty, foot } = {}) {
  if (!rows.length) return `<div class="tbl-wrap"><div class="empty">${empty || 'ไม่มีข้อมูล'}</div></div>`;
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${cols.map((c) => `<th class="${c.cls || ''}">${c.h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r, i) => `<tr ${rowAct ? `class="click" data-act="${rowAct}" data-id="${esc(rowId ? rowId(r) : r.id)}"` : ''}>${cols.map((c) => `<td class="${c.cls || ''}">${c.f(r, i)}</td>`).join('')}</tr>`).join('')}</tbody>
    ${foot ? `<tfoot>${foot}</tfoot>` : ''}</table></div>`;
}
function pager(res, key) {
  const pages = Math.max(1, Math.ceil(res.total / res.size));
  return `<div class="pager"><span class="muted">ทั้งหมด ${num(res.total)} รายการ · หน้า ${res.page}/${pages}</span>
    <button class="btn btn-o btn-sm" data-act="page" data-key="${key}" data-page="${res.page - 1}" ${res.page <= 1 ? 'disabled' : ''}>‹ ก่อนหน้า</button>
    <button class="btn btn-o btn-sm" data-act="page" data-key="${key}" data-page="${res.page + 1}" ${res.page >= pages ? 'disabled' : ''}>ถัดไป ›</button></div>`;
}

// ---------------- export ----------------
function downloadB64(b64, mime, filename) {
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([arr], { type: mime }));
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function exportReport(report, params, format) {
  toast('กำลังสร้างไฟล์...');
  if (format === 'xlsx') {
    const rep = await api('report.data', { report, params });
    const aoa = [[rep.title], [rep.subtitle || ''], [rep.printed || ''], rep.headers, ...rep.rows];
    if (rep.totalCol != null) {
      const t = rep.headers.map(() => '');
      t[1] = 'รวมทั้งสิ้น';
      t[rep.totalCol] = rep.rows.reduce((s, r) => s + Number(r[rep.totalCol] || 0), 0);
      aoa.push(t);
    }
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = rep.headers.map((h, i) => ({ wch: Math.min(45, Math.max(String(h).length + 2, ...rep.rows.slice(0, 300).map((r) => String(r[i] == null ? '' : r[i]).length + 2))) }));
    const last = rep.headers.length - 1;
    ws['!merges'] = [0, 1, 2].map((r) => ({ s: { r, c: 0 }, e: { r, c: last } }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'รายงาน');
    XLSX.writeFile(wb, `${report}_${today()}.xlsx`);
    return;
  }
  const f = await api('export.file', { report, params, format });
  downloadB64(f.base64, f.mime, f.filename.replace(/^(\w+)/, `$1_${today()}`));
}
function exportBtns(report, { xlsx = true, params } = {}) {
  const p = params ? ` data-params="${esc(JSON.stringify(params))}"` : '';
  return `<span class="row" style="gap:4px">
    ${xlsx ? `<button class="btn btn-o btn-sm" data-act="export" data-report="${report}" data-format="xlsx"${p}>Excel</button>` : ''}
    <button class="btn btn-o btn-sm" data-act="export" data-report="${report}" data-format="docx"${p}>Word</button>
    <button class="btn btn-o btn-sm" data-act="export" data-report="${report}" data-format="pdf"${p}>PDF</button></span>`;
}

// ---------------- image ----------------
function compressImage(file, max = 1600, q = 0.8) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => rej(new Error('อ่านไฟล์รูปไม่ได้: ' + file.name));
    img.src = url;
  });
}

$('#loginForm').addEventListener('submit', run(async (e) => {
  e.preventDefault();
  const f = readForm(e.target);
  $('#loginErr').hidden = true;
  busy(true);
  let r;
  try { r = await gs('login', f.username, f.password); } finally { busy(false); }
  if (!r.ok) { $('#loginErr').textContent = r.error; $('#loginErr').hidden = false; return; }
  S.token = r.data.token;
  LS.set('ltc_token', S.token);
  try { await boot(); } catch (err) { $('#app').hidden = true; $('#login').hidden = false; showFatal(err); }
}));

function showFatal(e) {
  const el = $('#loginErr');
  el.textContent = 'เริ่มระบบไม่สำเร็จ: ' + (e && e.message ? e.message : e);
  el.hidden = false;
}
window.__ltcReady = true;

async function boot() {
  const me = await api('me');
  S.user = me.user; S.settings = me.settings || {};
  $('#login').hidden = true; $('#app').hidden = false;
  $('#userName').textContent = `${S.user.full_name} · ${ROLE_TH[S.user.role]}`;
  $('#avatar').textContent = (S.user.full_name || 'U').trim().charAt(0);
  $('#orgName').textContent = (S.settings.org && S.settings.org.name) || 'ดูแลผู้มีภาวะพึ่งพิง';
  renderNav();
  const last = LS.get('ltc_view');
  go(NAV.some((n) => n.id === last && can(n.roles)) ? last : 'dashboard');
}

function doLogout(expired) {
  if (S.token) gs('logout', S.token).catch(() => {});
  S.token = null; S.user = null;
  LS.del('ltc_token');
  $('#app').hidden = true; $('#login').hidden = false;
  $('#modalRoot').innerHTML = '';
  if (expired) toast('หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่', true);
}

function renderNav() {
  let html = '';
  NAV.forEach((n, i) => {
    if (n.g) {
      const next = NAV.slice(i + 1).find((x) => x.g || can(x.roles));
      if (next && !next.g) html += `<div class="nav-group">${esc(n.g)}</div>`;
    } else if (can(n.roles)) html += `<a data-act="nav" data-view="${n.id}">${icon(n.icon)}<span>${esc(n.label)}</span></a>`;
  });
  $('#nav').innerHTML = html;
}

function go(view) {
  S.view = view; S.exportParams = null;
  LS.set('ltc_view', view);
  S.charts.forEach((c) => c.destroy()); S.charts = [];
  $$('#nav a').forEach((a) => a.classList.toggle('on', a.dataset.view === view));
  const item = NAV.find((n) => n.id === view);
  $('#viewTitle').textContent = item ? item.label : '';
  $('#side').classList.remove('open');
  V.innerHTML = '<div class="empty">กำลังโหลด...</div>';
  run(VIEWS[view])();
}
function refresh() { go(S.view); }

// ---------------- global click delegation ----------------
const H = {};
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) {
    $$('.pp-list').forEach((l) => { if (!l.parentElement.contains(e.target)) l.hidden = true; });
    return;
  }
  if (b.tagName === 'TR' && e.target.closest('input,select,button,a,label,textarea')) return;
  const fn = H[b.dataset.act];
  if (fn) { e.preventDefault(); run(fn)(b.dataset, b, e); }
});
H.nav = (d) => go(d.view);
H.toggleMenu = () => $('#side').classList.toggle('open');
H.logout = () => doLogout();
H.closeModal = (d, b) => closeModal(b);
H.page = (d) => { S.state[d.key].page = Math.max(1, +d.page); S.loaders[d.key](); };
H.export = (d) => exportReport(d.report, d.params ? JSON.parse(d.params) : (S.exportParams ? S.exportParams(d.report) : {}), d.format);
H.ppPick = (d, b) => {
  const box = b.closest('.pp');
  $('input[type=hidden]', box).value = d.id;
  $('.pp-q', box).value = d.label;
  $('.pp-list', box).hidden = true;
  box.dispatchEvent(new CustomEvent('pp-change', { detail: { id: d.id, label: d.label }, bubbles: true }));
};

const CHART_INK = '#4d5f55', CHART_GRID = '#eceee6', CHART_FILL = '#1f6b47';
function barChart(canvas, labels, data, opt = {}) {
  if (!window.Chart) return;
  S.charts.push(new Chart(canvas, {
    type: 'bar',
    data: { labels, datasets: [{ data, backgroundColor: opt.colors || CHART_FILL, borderRadius: 4, borderSkipped: 'start', maxBarThickness: 38 }] },
    options: {
      indexAxis: opt.horizontal ? 'y' : 'x', maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${num(c.parsed[opt.horizontal ? 'x' : 'y'])} ${opt.unit || ''}` } } },
      scales: {
        x: { grid: { display: !!opt.horizontal, color: CHART_GRID }, ticks: { color: CHART_INK, font: { family: 'Sarabun' } }, beginAtZero: true },
        y: { grid: { display: !opt.horizontal, color: CHART_GRID }, ticks: { color: CHART_INK, precision: 0, font: { family: 'Sarabun' } }, beginAtZero: true }
      }
    }
  }));
}
function kpi(label, value, sub, accent) {
  return `<div class="kpi ${accent ? 'accent' : ''}"><div class="l">${esc(label)}</div><div class="v">${value}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`;
}
const pct = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '-');

          ${todo('บันทึกการเยี่ยมรอตรวจสอบ', d.visits_pending, 'visits')}

    </div>

function bindTabs(root) {
  $$('[data-tabs] [data-tab]', root).forEach((b) => {

    };
  });
}

const IMPORT_MAP = {
  cid: ['เลขบัตรประชาชน', 'เลขประจำตัวประชาชน', 'เลขบัตร', 'cid', 'pid', 'idcard'],

  first_name: ['ชื่อ', 'first_name', 'firstname', 'fname', 'name'],
  last_name: ['นามสกุล', 'สกุล', 'last_name', 'lastname', 'lname'],
  full_name: ['ชื่อ-สกุล', 'ชื่อ-นามสกุล', 'ชื่อสกุล', 'fullname'],
  gender: ['เพศ', 'sex', 'gender'],
  birth_date: ['วันเกิด', 'วันเดือนปีเกิด', 'birth_date', 'birthdate', 'dob'],
  house_no: ['บ้านเลขที่', 'house_no', 'houseno', 'เลขที่'],
  moo: ['หมู่', 'หมู่ที่', 'moo', 'village'],
  subdistrict: ['ตำบล', 'subdistrict', 'tambon'], district: ['อำเภอ', 'district', 'amphur'], province: ['จังหวัด', 'province'],
  phone: ['โทรศัพท์', 'เบอร์โทร', 'โทร', 'phone', 'tel'],
  health_right: ['สิทธิการรักษา', 'สิทธิ', 'health_right'],
  disability_type: ['ประเภทความพิการ', 'ความพิการ', 'disability_type'],
  chronic_diseases: ['โรคประจำตัว', 'โรค', 'chronic_diseases']
};
const normH = (s) => String(s || '').toLowerCase().replace(/[\s_]/g, '');
H.personImport = () => {
  const m = openModal({ title: 'นำเข้าข้อมูลประชากรจาก Excel / CSV', wide: true, body: `
    <div class="hint mb">รองรับไฟล์ .xlsx .xls .csv — แถวแรกเป็นหัวคอลัมน์ ระบบจับคู่คอลัมน์อัตโนมัติ (ชื่อ, นามสกุล, เลขบัตรประชาชน, วันเกิด, หมู่ ฯลฯ)
      วันที่รองรับทั้ง พ.ศ./ค.ศ. · บุคคลที่เลขบัตรซ้ำกับในระบบจะถูก <b>อัปเดต</b></div>
    <div class="row mb"><input type="file" accept=".xlsx,.xls,.csv" data-file style="flex:1"><button class="btn btn-o btn-sm" data-tpl>ดาวน์โหลดไฟล์ต้นแบบ</button></div>
    <div data-preview></div>`,
    foot: `<button class="btn btn-o" data-act="closeModal">ยกเลิก</button><button class="btn btn-p" data-go disabled>นำเข้าข้อมูล</button>` });
  let rows = [];
  $('[data-tpl]', m).onclick = () => {
    const ws = XLSX.utils.aoa_to_sheet([['เลขบัตรประชาชน', 'คำนำหน้า', 'ชื่อ', 'นามสกุล', 'เพศ', 'วันเกิด', 'บ้านเลขที่', 'หมู่', 'ตำบล', 'อำเภอ', 'จังหวัด', 'โทรศัพท์', 'สิทธิการรักษา', 'ประเภทความพิการ', 'โรคประจำตัว'],
      ['3100000000001', 'นาง', 'สมศรี', 'ใจดี', 'หญิง', '15/03/2490', '12', '3', '', '', '', '0812345678', 'UC (บัตรทอง)', '', 'เบาหวาน, ความดัน']]);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'ประชากร'); XLSX.writeFile(wb, 'template_population.xlsx');
  };
  $('[data-file]', m).onchange = run(async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const isCsv = /\.csv$/i.test(file.name);
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', raw: isCsv, codepage: 65001 });
    const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: true });
    if (!raw.length) throw new Error('ไม่พบข้อมูลในไฟล์');
    const heads = Object.keys(raw[0]);
    const map = {};
    Object.entries(IMPORT_MAP).forEach(([k, alias]) => { const h = heads.find((x) => alias.map(normH).includes(normH(x))); if (h) map[k] = h; });
    rows = raw.map((r) => {
      const o = {};
      Object.entries(map).forEach(([k, h]) => { o[k] = r[h]; });
      if (o.full_name && !o.first_name) {
        let s = String(o.full_name).trim();
        const pf = PREFIX.find((x) => s.startsWith(x)); if (pf) { o.prefix = o.prefix || pf; s = s.slice(pf.length).trim(); }
        const parts = s.split(/\s+/); o.first_name = parts.shift(); o.last_name = parts.join(' ');
      }
      delete o.full_name;
      if (o.cid != null) o.cid = String(o.cid);
      return o;
    }).filter((o) => o.first_name);
    const cols = Object.keys(IMPORT_MAP).filter((k) => k !== 'full_name' && rows.some((r) => r[k] !== undefined && r[k] !== ''));
    $('[data-preview]', m).innerHTML = `<div class="row mb small"><b>${num(rows.length)}</b> แถว · คอลัมน์ที่จับคู่ได้:
      ${Object.entries(map).map(([k, h]) => `<span class="tag t-green">${esc(h)}</span>`).join(' ')}
      ${heads.filter((h) => !Object.values(map).includes(h)).map((h) => `<span class="tag" title="ไม่ได้ใช้">${esc(h)}</span>`).join(' ')}</div>
      ${tableHtml(cols.map((k) => ({ h: k, f: (r) => esc(r[k] == null ? '' : r[k]) })), rows.slice(0, 8))}
      ${rows.length > 8 ? `<div class="xs muted mt">แสดง 8 แถวแรก</div>` : ''}`;
    $('[data-go]', m).disabled = !rows.length;
  });
  $('[data-go]', m).onclick = run(async () => {
    let done = 0; const errors = [];
    for (let i = 0; i < rows.length; i += 1000) {
      const r = await api('persons.import', { rows: rows.slice(i, i + 1000) });
      done += r.imported; errors.push(...r.errors.map((x) => x.replace(/แถว (\d+)/, (a, n) => `แถว ${+n + i}`)));
    }
    closeModal(m);
    toast(`นำเข้าสำเร็จ ${num(done)} รายการ${errors.length ? ` · ผิดพลาด ${errors.length}` : ''}`);
    if (errors.length) openModal({ title: 'แถวที่นำเข้าไม่ได้', body: `<div class="small">${errors.slice(0, 200).map(esc).join('<br>')}</div>` });
    if (S.view === 'persons') loadPersons();
  });
};

function calcAdl(a) {
  const cfg = Object.assign({ bed_max: 4, home_max: 11, ltc_max: 11 }, S.settings.adl || {});
  const total = ADL_ITEMS.reduce((s, [k]) => s + Number(a[k] || 0), 0);
  const level = total <= cfg.bed_max ? 'ติดเตียง' : total <= cfg.home_max ? 'ติดบ้าน' : 'ติดสังคม';
  let group = null;
  if (total <= cfg.ltc_max) group = a.terminal_ill ? 4 : total <= cfg.bed_max ? 3 : a.cognitive_impairment ? 2 : 1;
  return { total, level, group };

  };

  $('[data-save]', m).onclick = run(async () => {
    const f = readForm(m);
    if (!f.person_id) throw new Error('กรุณาเลือกผู้ถูกประเมิน');
    if (ADL_ITEMS.some(([k]) => f[k] === undefined)) throw new Error('กรุณาประเมินให้ครบทั้ง 10 ข้อ');
    const saved = await api('adl.save', Object.assign(f, { id: a.id }));
    closeModal(m);
    toast(`บันทึกแล้ว: ADL ${saved.total_score} คะแนน (${saved.dependency_level})`);

    if (saved.ltc_group && isStaff() && !a.id && (await askConfirm(`ผู้ถูกประเมินเข้าเกณฑ์ LTC กลุ่ม ${saved.ltc_group} ต้องการจัดทำ Care Plan ต่อหรือไม่?`, 'จัดทำ Care Plan'))) {
      planEditor({ person_id: f.person_id }, $('.pp-q', m) ? $('.pp-q', m).value : label);
    }
  });
  const del = $('[data-del]', m);
  if (del) del.onclick = run(async () => { if (!(await askConfirm('ลบผลประเมินนี้?', 'ลบ', true))) return; await api('adl.delete', { id: a.id }); closeModal(m); toast('ลบแล้ว'); refresh(); });

    <div class="small muted mt">บันทึกการเยี่ยมตามแผนนี้ ${p.visit_count} ครั้ง</div>`,
    foot: `${exportBtns('careplan', { xlsx: false, params: { id: p.id } })}<span class="grow"></span>
      ${isStaff() && st === 'draft' ? btn('btn-d', 'data-x="delete"', 'ลบร่าง') : ''}
      ${isStaff() && st !== 'closed' ? btn('btn-o', 'data-x="edit"', st === 'draft' ? 'แก้ไข' : 'ปรับแก้แผน') : ''}
      ${isStaff() && st === 'draft' ? btn('btn-p', 'data-x="approved"', 'อนุมัติแผน') : ''}
      ${isStaff() && st === 'approved' ? btn('btn-p', 'data-x="active"', 'เริ่มดำเนินการ') : ''}
      ${isStaff() && (st === 'active' || st === 'approved') ? btn('btn-o', 'data-x="closed"', 'ปิดแผน') : ''}
      ${(st === 'active' || st === 'approved') && can(['admin', 'cm', 'cg']) ? `<button class="btn btn-g" data-act="visitNew" data-plan="${p.id}">บันทึกการเยี่ยม</button>` : ''}` });
  $$('[data-x]', m).forEach((b) => { b.onclick = run(async () => {
    const x = b.dataset.x;
    if (x === 'edit') { closeModal(m); return planEditor(p, fname(p.persons)); }
    if (x === 'delete') { if (!(await askConfirm('ลบ Care Plan ฉบับร่างนี้?', 'ลบ', true))) return; await api('plans.delete', { id: p.id }); }
    else {
      const label = { approved: 'อนุมัติ', active: 'เริ่มดำเนินการ', closed: 'ปิด' }[x];
      if (!(await askConfirm(`${label} Care Plan ${p.plan_no}?`, label))) return;
      await api('plans.status', { id: p.id, status: x });
    }
    closeModal(m); toast('บันทึกแล้ว'); if (S.view === 'careplans') loadPlans();
  }); });
};

async function planEditor(plan, label) {
  const [cms, cgs] = await Promise.all([api('cm.list'), api('cg.list')]);
  const rates = S.settings.rates || {};
  const isNew = !plan.id;
  const needReason = !isNew && plan.status !== 'draft';
  const p = Object.assign({ start_date: today(), cm_id: S.user.care_manager_id || '' }, plan);
  if (!p.end_date) p.end_date = addYear(p.start_date);
  const m = openModal({ title: isNew ? 'จัดทำ Care Plan' : needReason ? `ปรับแก้ Care Plan ${p.plan_no} (จะบันทึกเป็นฉบับที่ ${p.version + 1})` : `แก้ไข Care Plan ${p.plan_no}`, wide: true, body: `
    ${needReason ? '<div class="warn mb">แผนนี้อนุมัติแล้ว การแก้ไขจะเก็บฉบับเดิมไว้ในประวัติ และต้องระบุเหตุผลการปรับแก้</div>' : ''}
    <div class="form c3">
      ${isNew ? fieldHtml({ k: 'person_id', label: 'ผู้รับบริการ', type: 'person', display: label, span: true }, p.person_id) : `<div class="f span"><label>ผู้รับบริการ</label><b>${esc(label)}</b><input type="hidden" name="person_id" value="${p.person_id}"></div>`}
      <input type="hidden" name="adl_id" value="${esc(p.adl_id || '')}">
      ${fieldHtml({ k: 'adl_score', label: 'คะแนน ADL', type: 'number', attrs: 'min="0" max="20"' }, p.adl_score == null ? '' : p.adl_score)}
      ${fieldHtml({ k: 'ltc_group', label: 'กลุ่มชุดสิทธิประโยชน์', type: 'select', options: [[1, 'กลุ่ม 1'], [2, 'กลุ่ม 2'], [3, 'กลุ่ม 3'], [4, 'กลุ่ม 4']] }, p.ltc_group)}
      <div class="f"><label>\u00a0</label><div class="xs muted" data-adlinfo></div></div>
      ${fieldHtml({ k: 'cm_id', label: 'Care Manager', type: 'select', options: cms.filter((x) => x.status === 'active' || x.id === p.cm_id).map((x) => [x.id, x.full_name]) }, p.cm_id)}
      ${fieldHtml({ k: 'cg_id', label: 'Caregiver ผู้ดูแล', type: 'select', options: cgs.filter((x) => x.status === 'active' || x.id === p.cg_id).map((x) => [x.id, `${x.full_name} (ดูแล ${x.case_count} คน)`]) }, p.cg_id)}
      <div></div>
      ${fieldHtml({ k: 'start_date', label: 'วันเริ่มแผน', type: 'date', req: true }, p.start_date)}
      ${fieldHtml({ k: 'end_date', label: 'วันสิ้นสุดแผน', type: 'date' }, p.end_date)}
      <div></div>
      ${fieldHtml({ k: 'problems', label: 'ปัญหา / ความต้องการของผู้รับบริการ', type: 'textarea', span: true, ph: 'เช่น ช่วยเหลือตัวเองได้น้อย มีแผลกดทับที่ก้นกบ ผู้ดูแลหลักขาดทักษะ...' }, p.problems)}
      ${fieldHtml({ k: 'goals', label: 'เป้าหมายการดูแล', type: 'textarea', span: true, ph: 'เช่น ไม่เกิดแผลกดทับใหม่ แผลเดิมหายภายใน 3 เดือน คะแนน ADL ไม่ลดลง...' }, p.goals)}
    </div>
    <div class="row mt mb"><h3 class="grow">กิจกรรมการดูแลตามชุดสิทธิประโยชน์</h3>
      <button class="btn btn-g btn-sm" data-tpl>เติมกิจกรรมมาตรฐานตามกลุ่ม</button><button class="btn btn-o btn-sm" data-add>+ เพิ่มกิจกรรม</button></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>ด้าน</th><th style="min-width:240px">กิจกรรม</th><th>ครั้ง/เดือน</th><th>บาท/ครั้ง</th><th>ผู้รับผิดชอบ</th><th class="right">รวม/เดือน</th><th></th></tr></thead><tbody data-items></tbody></table></div>
    <datalist id="actList">${PLAN_TEMPLATES.map((t) => `<option value="${esc(t[1])}">`).join('')}</datalist>
    <div class="row mt" data-total></div>
    ${needReason ? `<div class="f mt"><label>เหตุผลการปรับแก้ Care Plan <span class="req">*</span></label><textarea data-reason rows="2" placeholder="เช่น ผลประเมิน ADL เปลี่ยนแปลง / เปลี่ยน CG / ผู้รับบริการมีแผลกดทับใหม่"></textarea></div>` : ''}`,
    foot: `<button class="btn btn-o" data-act="closeModal">ยกเลิก</button><button class="btn btn-p" data-save>บันทึก Care Plan</button>` });

  const tbody = $('[data-items]', m);
  const rowHtml = (i) => `<tr><td><select data-k="category">${opts(CATS, i.category)}</select></td>
    <td><input type="text" data-k="activity" list="actList" value="${esc(i.activity || '')}"></td>
    <td><input type="number" data-k="times_per_month" min="0" value="${i.times_per_month == null ? 4 : i.times_per_month}" style="width:80px"></td>
    <td><input type="number" data-k="unit_cost" min="0" step="0.01" value="${i.unit_cost == null ? 0 : i.unit_cost}" style="width:100px"></td>
    <td><select data-k="responsible">${opts(RESP, i.responsible || 'CG')}</select></td><td class="right nowrap" data-sub></td>
    <td><button class="btn-x" data-rm title="ลบ">✕</button></td></tr>`;
  const addRows = (list) => { tbody.insertAdjacentHTML('beforeend', list.map(rowHtml).join('')); calc(); };
  const readItems = () => $$('tr', tbody).map((tr) => Object.fromEntries($$('[data-k]', tr).map((el) => [el.dataset.k, el.value.trim()]))).filter((i) => i.activity);
  const months = () => {
    const a = $('[name=start_date]', m).value, b = $('[name=end_date]', m).value;
    if (!a || !b) return 12;
    const d1 = new Date(a), d2 = new Date(b);
    return Math.max(1, (d2.getFullYear() - d1.getFullYear()) * 12 + d2.getMonth() - d1.getMonth() + (d2.getDate() >= d1.getDate() ? 1 : 0));
  };
  function calc() {
    let monthly = 0;
    $$('tr', tbody).forEach((tr) => {
      const sub = Number($('[data-k=times_per_month]', tr).value || 0) * Number($('[data-k=unit_cost]', tr).value || 0);
      monthly += sub; $('[data-sub]', tr).textContent = money(sub);
    });
    const g = $('[name=ltc_group]', m).value;
    const ceil = g ? Number((rates.group_budget || {})[g] || rates.fund_per_person_year || 0) : 0;
    const total = monthly * months();
    $('[data-total]', m).innerHTML = `<span>รวมต่อเดือน <b>${money(monthly)}</b> บาท × ${months()} เดือน = <b style="font-size:17px">${money(total)}</b> บาท</span>
      ${ceil ? `<span class="tag ${total > ceil ? 't-red' : 't-green'}">เพดานกลุ่ม ${g}: ${money(ceil)} บาท/ปี ${total > ceil ? '— เกินเพดาน' : ''}</span>` : ''}`;
  }
  tbody.addEventListener('input', calc);
  tbody.addEventListener('click', (e) => { if (e.target.closest('[data-rm]')) { e.target.closest('tr').remove(); calc(); } });
  ['start_date', 'end_date', 'ltc_group'].forEach((k) => { $(`[name=${k}]`, m).addEventListener('change', calc); });
  $('[data-add]', m).onclick = () => addRows([{ responsible: 'CG', unit_cost: rates.cg_rate_per_visit || 0 }]);
  $('[data-tpl]', m).onclick = () => {
    const g = $('[name=ltc_group]', m).value;
    if (!g) return toast('กรุณาเลือกกลุ่มชุดสิทธิประโยชน์ก่อน', true);
    const existing = readItems().map((i) => i.activity);
    addRows(GROUP_TPL[g].map((i) => PLAN_TEMPLATES[i]).filter((t) => !existing.includes(t[1])).map(([category, activity, responsible]) => ({
      category, activity, responsible, times_per_month: responsible === 'CG' ? (g >= 3 ? 8 : 4) : 1, unit_cost: responsible === 'CG' ? (rates.cg_rate_per_visit || 0) : 0
    })));
  };
  // เลือกผู้รับบริการ -> ดึงผล ADL ล่าสุด
  const loadAdlInfo = run(async (pid) => {
    const a = await api('adl.latest', { person_id: pid }, true);
    if (!a) { $('[data-adlinfo]', m).innerHTML = '<span class="tag t-amber">ยังไม่มีผลประเมิน ADL</span>'; return; }
    $('[name=adl_id]', m).value = a.id; $('[name=adl_score]', m).value = a.total_score;
    if (a.ltc_group) $('[name=ltc_group]', m).value = a.ltc_group;
    $('[data-adlinfo]', m).innerHTML = `ADL ล่าสุด ${thDate(a.assess_date)}: <b>${a.total_score}</b> ${levelTag(a.dependency_level)}`;
    calc();
  });
  m.addEventListener('pp-change', (e) => loadAdlInfo(e.detail.id));
  if (isNew && p.person_id) loadAdlInfo(p.person_id);
  addRows(plan.items && plan.items.length ? plan.items : []);
  calc();

  $('[data-save]', m).onclick = run(async () => {
    validate(m);
    const f = readForm(m);
    if (!f.person_id) throw new Error('กรุณาเลือกผู้รับบริการ');
    const reason = needReason ? $('[data-reason]', m).value.trim() : '';
    if (needReason && !reason) throw new Error('กรุณาระบุเหตุผลการปรับแก้ Care Plan');
    const saved = await api('plans.save', { plan: Object.assign(f, { id: plan.id }), items: readItems(), reason });
    closeModal(m);
    toast(saved.warning ? saved.warning : `บันทึก Care Plan ${saved.plan_no} แล้ว`, !!saved.warning);
    if (S.view === 'careplans') loadPlans();
    H.planOpen({ id: saved.id });
  });
}

async function visitForm(planId, visit) {
  const v = visit || { visit_date: today(), start_time: new Date().toTimeString().slice(0, 5), vitals: {}, activities: [] };
  const plans = (await api('plans.list', {})).filter((p) => ['approved', 'active'].includes(p.status) || p.id === planId);
  if (!plans.length) throw new Error('ยังไม่มี Care Plan ที่อนุมัติแล้วสำหรับบันทึกการเยี่ยม');
  const vt = v.vitals || {};
  const m = openModal({ title: visit ? 'แก้ไขบันทึกการเยี่ยม' : 'บันทึกการปฏิบัติงานตาม Care Plan', wide: true, body: `
    <div class="form c3">
      <div class="f span"><label>Care Plan / ผู้รับบริการ <span class="req">*</span></label><select name="care_plan_id" required ${visit ? 'disabled' : ''}>
        <option value="">— เลือก —</option>${opts(plans.map((p) => [p.id, `${fname(p.persons)} · หมู่ ${p.persons.moo || '-'} · ${p.plan_no}`]), planId)}</select></div>
      ${fieldHtml({ k: 'visit_date', label: 'วันที่เยี่ยม', type: 'date', req: true }, v.visit_date)}
      ${fieldHtml({ k: 'start_time', label: 'เวลาเริ่ม', type: 'time' }, (v.start_time || '').slice(0, 5))}
      ${fieldHtml({ k: 'end_time', label: 'เวลาสิ้นสุด', type: 'time' }, (v.end_time || '').slice(0, 5))}
    </div>
    <h3 class="mt mb">สัญญาณชีพ</h3>
    <div class="form c3" data-vitals>
      ${fieldHtml({ k: 'bp', label: 'ความดัน (BP)', ph: '120/80' }, vt.bp)}${fieldHtml({ k: 'pulse', label: 'ชีพจร (ครั้ง/นาที)', type: 'number' }, vt.pulse)}
      ${fieldHtml({ k: 'temp', label: 'อุณหภูมิ (°C)', type: 'number', attrs: 'step="0.1"' }, vt.temp)}${fieldHtml({ k: 'dtx', label: 'น้ำตาลปลายนิ้ว (DTX)', type: 'number' }, vt.dtx)}
      ${fieldHtml({ k: 'weight', label: 'น้ำหนัก (กก.)', type: 'number', attrs: 'step="0.1"' }, vt.weight)}
    </div>
    <h3 class="mt mb">กิจกรรมที่ดำเนินการตาม Care Plan</h3>
    <div class="grid g2" data-acts><span class="muted small">เลือก Care Plan เพื่อแสดงรายการกิจกรรม</span></div>
    <div class="form mt">
      ${fieldHtml({ k: 'notes', label: 'บันทึกการดูแล / อาการผู้รับบริการ', type: 'textarea', span: true }, v.notes)}
      ${fieldHtml({ k: 'problems', label: 'ปัญหาที่พบ / ต้องการส่งต่อ CM', type: 'textarea', span: true }, v.problems)}
    </div>
    <input type="hidden" name="lat" value="${esc(v.lat || '')}"><input type="hidden" name="lng" value="${esc(v.lng || '')}">
    <div class="row mt"><button class="btn btn-o btn-sm" data-gps>📍 บันทึกพิกัดปัจจุบัน</button><span class="small muted" data-gpsinfo>${v.lat ? `${v.lat}, ${v.lng}` : ''}</span></div>
    <h3 class="mt mb">แนบรูปภาพการปฏิบัติงาน</h3>
    <div class="photos mb" data-old>${(v.photos || []).map((p) => `<div class="photo"><img src="${esc(p.url)}" alt=""><button class="del" data-delphoto="${p.id}" title="ลบรูป">✕</button></div>`).join('')}</div>
    <label class="btn btn-g" style="display:inline-flex">📷 เลือก/ถ่ายรูป<input type="file" accept="image/*" multiple data-files hidden></label>
    <span class="xs muted">สูงสุด 10 รูปต่อครั้ง · ระบบย่อขนาดรูปอัตโนมัติ</span>
    <div class="photos mt" data-new></div>
    <div class="small muted mt" data-progress></div>`,
    foot: `<button class="btn btn-o" data-act="closeModal">ยกเลิก</button><button class="btn btn-p" data-save>บันทึกการเยี่ยม</button>` });

  const files = [];
  const actBox = $('[data-acts]', m);
  const loadActs = run(async (pid) => {
    if (!pid) return;
    const p = await api('plans.get', { id: pid }, true);
    const done = Object.fromEntries((v.activities || []).map((a) => [a.item_id || a.activity, a.done]));
    actBox.innerHTML = p.items.map((i) => `<label class="chk card" style="padding:8px 10px"><input type="checkbox" data-item="${i.id}" data-name="${esc(i.activity)}"
      ${done[i.id] || done[i.activity] || (!visit && i.responsible === 'CG') ? 'checked' : ''}> <span>${esc(i.activity)} <span class="xs muted">(${esc(i.responsible || '')})</span></span></label>`).join('')
      || '<span class="muted small">แผนนี้ยังไม่มีกิจกรรม</span>';
  });
  $('[name=care_plan_id]', m).onchange = (e) => loadActs(e.target.value);
  if (planId) loadActs(planId);

  $('[data-gps]', m).onclick = () => {
    if (!navigator.geolocation) return toast('อุปกรณ์ไม่รองรับการระบุตำแหน่ง', true);
    navigator.geolocation.getCurrentPosition((pos) => {
      $('[name=lat]', m).value = pos.coords.latitude.toFixed(6); $('[name=lng]', m).value = pos.coords.longitude.toFixed(6);
      $('[data-gpsinfo]', m).textContent = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)} (±${Math.round(pos.coords.accuracy)} ม.)`;
    }, (err) => toast('ไม่สามารถระบุตำแหน่งได้: ' + err.message, true), { enableHighAccuracy: true, timeout: 15000 });
  };
  $('[data-files]', m).onchange = run(async (e) => {
    const existing = $$('[data-old] .photo', m).length;
    for (const f of Array.from(e.target.files)) {
      if (files.length + existing >= 10) { toast('แนบรูปได้สูงสุด 10 รูป', true); break; }
      const data = await compressImage(f);
      files.push(data);
      $('[data-new]', m).insertAdjacentHTML('beforeend', `<div class="photo"><img src="${data}" alt=""><button class="del" data-rmnew="${files.length - 1}" title="ลบ">✕</button></div>`);
    }
    e.target.value = '';
  });
  m.addEventListener('click', run(async (e) => {
    const rn = e.target.closest('[data-rmnew]');
    if (rn) { files[+rn.dataset.rmnew] = null; rn.parentElement.remove(); }
    const dp = e.target.closest('[data-delphoto]');
    if (dp && (await askConfirm('ลบรูปนี้?', 'ลบ', true))) { await api('visits.photo.delete', { id: dp.dataset.delphoto }); dp.parentElement.remove(); }
  }));

  $('[data-save]', m).onclick = run(async () => {
    validate(m);
    const f = readForm(m);
    const vitals = readForm($('[data-vitals]', m));
    const activities = $$('[data-item]', m).map((c) => ({ item_id: c.dataset.item, activity: c.dataset.name, done: c.checked }));
    const btn = $('[data-save]', m); btn.disabled = true;
    try {
      const saved = await api('visits.save', { id: visit && visit.id, care_plan_id: f.care_plan_id || planId, visit_date: f.visit_date, start_time: f.start_time,
        end_time: f.end_time, vitals, activities, notes: f.notes, problems: f.problems, lat: f.lat, lng: f.lng });
      const pending = files.filter(Boolean);
      for (let i = 0; i < pending.length; i++) {
        $('[data-progress]', m).textContent = `กำลังอัปโหลดรูป ${i + 1}/${pending.length} ...`;
        await api('visits.photo', { visit_id: saved.id, data: pending[i], mime: 'image/jpeg' });
      }
      closeModal(m); toast('บันทึกการเยี่ยมเรียบร้อย');
      if (S.view === 'visits') loadVisits(); else if (S.view === 'dashboard') refresh();
    } finally { btn.disabled = false; }
  });
}

  let list = ben;
  const renderBen = () => {
    $('[data-bencount]', m).textContent = `${selected.size} คน`;
    $('[data-ben]', m).innerHTML = list.length ? `<label class="chk mb"><input type="checkbox" data-allben ${selected.size === list.length ? 'checked' : ''}> เลือกทั้งหมด</label>

    box.innerHTML = tableHtml([{ h: 'เวลา', f: (l) => new Date(l.created_at).toLocaleString('th-TH') }, { h: 'ผู้ใช้', f: (l) => esc(l.username) }, { h: 'การทำงาน', f: (l) => `<code>${esc(l.action)}</code>` }, { h: 'รหัสข้อมูล', f: (l) => `<span class="xs muted">${esc(l.entity_id || '')}</span>` }], logs);
  } else {
    box.innerHTML = `<div style="max-width:420px">${formHtml([{ k: 'old_password', label: 'รหัสผ่านเดิม', type: 'password', req: true, span: true }, { k: 'new_password', label: 'รหัสผ่านใหม่ (อย่างน้อย 8 ตัว)', type: 'password', req: true, span: true }, { k: 'confirm', label: 'ยืนยันรหัสผ่านใหม่', type: 'password', req: true, span: true }])}</div>
      <div class="row mt"><button class="btn btn-p" data-save>เปลี่ยนรหัสผ่าน</button></div>`;
    $('[data-save]', box).onclick = run(async () => {
      validate(box); const f = readForm(box);
      if (f.new_password !== f.confirm) throw new Error('รหัสผ่านใหม่ไม่ตรงกัน');
      await api('account.password', f); toast('เปลี่ยนรหัสผ่านแล้ว'); $$('input', box).forEach((i) => { i.value = ''; });
    });
  }
}
H.setTab = (d) => { S.state.setTab = d.tab; refresh(); };
H.userEdit = async (d) => {
  const u = (S.state.users || []).find((x) => x.id === d.id) || { role: 'cg', active: true };
  const [cgs, cms] = await Promise.all([api('cg.list'), api('cm.list')]);
  const m = openModal({ title: u.id ? `แก้ไขผู้ใช้ ${u.username}` : 'เพิ่มผู้ใช้งาน', body: formHtml([
    u.id ? { k: '_u', label: 'ชื่อผู้ใช้', attrs: 'disabled' } : { k: 'username', label: 'ชื่อผู้ใช้ (a-z, 0-9)', req: true },
    { k: 'full_name', label: 'ชื่อ-สกุล', req: true },
    { k: 'role', label: 'บทบาท', type: 'select', blank: false, options: Object.entries(ROLE_TH) },
    { k: 'caregiver_id', label: 'ผูกกับข้อมูล Caregiver', type: 'select', options: cgs.map((c) => [c.id, c.full_name]), hint: 'จำเป็นสำหรับบทบาท Caregiver' },
    { k: 'care_manager_id', label: 'ผูกกับข้อมูล Care Manager', type: 'select', options: cms.map((c) => [c.id, c.full_name]) },
    { k: 'password', label: u.id ? 'ตั้งรหัสผ่านใหม่ (เว้นว่างถ้าไม่เปลี่ยน)' : 'รหัสผ่าน', type: 'password', req: !u.id },
    { k: 'active', label: 'เปิดใช้งาน', type: 'checkbox' }
  ], Object.assign({ _u: u.username }, u)),
    foot: `<button class="btn btn-o" data-act="closeModal">ยกเลิก</button><button class="btn btn-p" data-save>บันทึก</button>` });
  $('[data-save]', m).onclick = run(async () => { validate(m); const f = readForm(m); delete f._u; await api('users.save', Object.assign(f, { id: u.id })); closeModal(m); toast('บันทึกแล้ว'); refresh(); });
};

(async () => {
  const t = LS.get('ltc_token');
  if (!t) return;
  S.token = t;
  try { await boot(); } catch (e) { S.token = null; LS.del('ltc_token'); $('#app').hidden = true; $('#login').hidden = false; showFatal(e); }
})();
