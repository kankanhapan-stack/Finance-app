// *** เธชเธณเธเธฑเธ: เธ•เนเธญเธเธ•เธฃเธเธเธฑเธ API_KEY เนเธ Code.gs (เธเธฑเนเธ Google Apps Script) ***
const GAS_API_KEY = 'A0xA-MPXc0sFoulNNRanTDqeUkW_QAqc';

class GASClient {
  constructor(url){ this.url = url; }
  async get(params){
    const q = new URLSearchParams({ ...params, key: GAS_API_KEY }).toString();
    const res = await fetch(`${this.url}?${q}`, { method:'GET' });
    return res.json();
  }
  async post(body){
    const res = await fetch(this.url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ ...body, key: GAS_API_KEY }) });
    return res.json();
  }
  login(username, password){ return this.get({ action:'login', username, password }); }
  loadAll(){ return this.get({ action:'all' }); }
  create(entity, data){ return this.post({ action:'create', entity, data }); }
  update(entity, id, data){ return this.post({ action:'update', entity, id, data }); }
  delete(entity, id){ return this.post({ action:'delete', entity, id }); }
  bulkSync(entity, data){ return this.post({ action:'bulksync', entity, data }); }
}

// ---------- PDF EXPORT (เธฃเธญเธเธฃเธฑเธเธ เธฒเธฉเธฒเนเธ—เธขเธ”เนเธงเธข html2canvas) ----------
function loadScriptOnce(src){
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) return resolve();
    const s = document.createElement('script');
    s.src = src; s.onload = () => resolve(); s.onerror = () => reject(new Error('เนเธซเธฅเธ”เธชเธเธฃเธดเธเธ•เนเนเธกเนเธชเธณเน€เธฃเนเธ: ' + src));
    document.head.appendChild(s);
  });
}
async function loadPDFLibs(){
  await Promise.all([
    loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),
    loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js')
  ]);
}
async function exportElementToPDF(elementId, filename){
  await loadPDFLibs();
  const el = document.getElementById(elementId);
  if (!el) throw new Error('เนเธกเนเธเธเน€เธเธทเนเธญเธซเธฒเธ—เธตเนเธเธฐเธเธดเธกเธเน');
  const canvas = await window.html2canvas(el, { scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false });
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p','mm','a4');
  const pdfW = pdf.internal.pageSize.getWidth();
  const pdfH = pdf.internal.pageSize.getHeight();
  const imgW = pdfW - 20;
  const imgH = (canvas.height * imgW) / canvas.width;
  const imgData = canvas.toDataURL('image/jpeg', 0.95);
  let heightLeft = imgH, position = 10;
  pdf.addImage(imgData, 'JPEG', 10, position, imgW, imgH);
  heightLeft -= (pdfH - 20);
  while (heightLeft > 0){
    position = heightLeft - imgH + 10;
    pdf.addPage();
    pdf.addImage(imgData, 'JPEG', 10, position, imgW, imgH);
    heightLeft -= (pdfH - 20);
  }
  pdf.save(filename);
}

function render(){
  const root = document.getElementById('root');
  // เน€เธเนเธเธ•เธณเนเธซเธเนเธ focus/cursor เนเธงเนเธเนเธญเธ re-render เน€เธเธทเนเธญเนเธกเนเนเธซเนเธเธนเนเนเธเนเธเธดเธกเธเนเนเธฅเนเธงเนเธเธเธฑเธชเธซเธฅเธธเธ”
  const active = document.activeElement;
  let focusId = null, selStart = null, selEnd = null;
  if (active && active.id && (active.tagName==='INPUT' || active.tagName==='SELECT' || active.tagName==='TEXTAREA')){
    focusId = active.id;
    if (typeof active.selectionStart === 'number'){ selStart = active.selectionStart; selEnd = active.selectionEnd; }
  }
  root.innerHTML = state.auth.currentUser ? renderAppShell() : renderLogin();
  try { afterRender(); } catch(e){ console.error('afterRender error:', e); }
  if (focusId){
    const el = document.getElementById(focusId);
    if (el){
      el.focus();
      if (selStart !== null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}
function afterRender(){
  if (state.auth.currentUser && state.ui.activePage === 'dashboard') renderDashboardCharts();
  attachEnterKeyHandlers();
}
function attachEnterKeyHandlers(){
  const u = document.getElementById('login-username');
  const p = document.getElementById('login-password');
  [u,p].forEach(el => { if(el) el.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); }); });
}

async function doLogin(){

function goPage(id){ state.ui.activePage = id; render(); }

function renderPage(){
  switch(state.ui.activePage){
    case 'dashboard': return renderDashboard();
    case 'transactions': return renderTransactions();
    case 'reports': return renderReports();
    case 'facilities': return renderFacilities();
    case 'fiscalyears': return renderFiscalYears();

}

function saveTransaction(){
  const ui = state.ui.transactions;
  const f = ui.form;
  if (!f.amount) return;
  const record = {
    ...f,
    amount: parseFloat(f.amount),
    facilityId: parseInt(f.facilityId),
    accountId: (f.paymentMethod==='bank' && f.accountId) ? parseInt(f.accountId) : ''
  };
  if (ui.editing){
    const updated = { ...record, id: ui.editing };
    state.data.transactions = state.data.transactions.map(t => t.id===ui.editing ? updated : t);
    gasUpdate('transactions', ui.editing, updated);
  } else {
    const rec = { ...record, id: uid(), createdAt: new Date().toISOString(), createdBy: state.auth.currentUser.username };
    state.data.transactions.push(rec);
    gasCreate('transactions', rec);
  }
  ui.showForm = false; ui.editing = null; ui.form = emptyTxForm();
  render();
}
function editTransaction(id){
  const t = state.data.transactions.find(x=>x.id===id);
  if (!t) return;
  const tree = categoryTreeFor(t.type || 'income');
  const form = { ...t };
  // เธฃเธญเธเธฃเธฑเธเธเนเธญเธกเธนเธฅเน€เธเนเธฒเธเนเธญเธเธญเธฑเธเน€เธ”เธ• (เธ—เธตเนเธขเธฑเธเนเธกเนเธกเธตเธซเธกเธงเธ”เธซเธฅเธฑเธ/เธขเนเธญเธขเนเธเธเนเธซเธกเน เธซเธฃเธทเธญเนเธกเนเธกเธต paymentMethod)
  if (!tree[form.category]) {
    const firstMain = Object.keys(tree)[0];
    form.category = firstMain; form.subCategory = tree[firstMain][0];
  }
  if (!form.paymentMethod) form.paymentMethod = form.accountId ? 'bank' : 'cash';
  state.ui.transactions.form = form;
  state.ui.transactions.editing = id;
  state.ui.transactions.showForm = true;
  render();
}
function deleteTransaction(id){
  if (!confirm('เธ•เนเธญเธเธเธฒเธฃเธฅเธเธฃเธฒเธขเธเธฒเธฃเธเธตเน?')) return;
  state.data.transactions = state.data.transactions.filter(t=>t.id!==id);
  gasDelete('transactions', id);
  render();

async function gasCreate(entity, data){
  if (!state.gas.client) return;
  state.gas.status='syncing'; render();
  try{ await state.gas.client.create(entity, data); state.gas.status='connected'; }
  catch(e){ state.gas.status='error'; }
  render();
}
async function gasUpdate(entity, id, data){
  if (!state.gas.client) return;
  state.gas.status='syncing'; render();
  try{ await state.gas.client.update(entity, id, data); state.gas.status='connected'; }
  catch(e){ state.gas.status='error'; }
  render();
}
async function gasDelete(entity, id){
  if (!state.gas.client) return;
  state.gas.status='syncing'; render();
  try{ await state.gas.client.delete(entity, id); state.gas.status='connected'; }
  catch(e){ state.gas.status='error'; }
  render();
}
async function syncAllFromGAS(){
  if (!state.gas.client) return;

  try{
    const res = await state.gas.client.loadAll();
    if (res.success){
      if (res.data.facilities?.length) state.data.facilities = res.data.facilities;

      state.gas.status='connected'; state.gas.message='เธเธดเธเธเนเธเนเธญเธกเธนเธฅเธชเธณเน€เธฃเนเธ';

      state.gas.status='error'; state.gas.message='เน€เธเธดเธ”เธเนเธญเธเธดเธ”เธเธฅเธฒเธ”: ' + res.message; render();
    }
  } catch(e){
    state.gas.status='error'; state.gas.message='เน€เธเธทเนเธญเธกเธ•เนเธญเนเธกเนเนเธ”เน: ' + e.message; render();
